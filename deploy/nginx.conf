server {
    listen 80;
    server_name your-domain.ru;

    # После выпуска сертификата раскомментируйте HTTPS-блок и редирект:
    # return 301 https://$host$request_uri;

    root /var/www/aero-planer/frontend/dist;
    index index.html;

    client_max_body_size 6m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API — путь /api/... сохраняется (Express: app.use('/api', ...))
    # Без trailing slash у proxy_pass, иначе Nginx срежет префикс /api
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загрузки (фото дронов) — auth на стороне Node
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
        add_header Cache-Control "private, max-age=3600";
    }

    # Socket.io (WebSocket) — путь по умолчанию /socket.io/, не /api/
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Пример HTTPS (Let's Encrypt):
# server {
#     listen 443 ssl http2;
#     server_name your-domain.ru;
#     ssl_certificate /etc/letsencrypt/live/your-domain.ru/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.ru/privkey.pem;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     ... скопируйте location-блоки выше ...
# }
